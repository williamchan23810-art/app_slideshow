<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App_SlideShow | Travel Memories</title>

  <!-- Open Graph Meta Tags for Meta-Debugger -->
  <meta property="og:title" content="Slide-Show Studio" />
  <meta property="og:description" content="Easy Slide-Show Creator, Video made simple" />
  <meta property="og:type" content="website" />
  <!-- NOTE: Social sharing previews (WhatsApp, Facebook, etc.) require an ABSOLUTE URL for the og:image. -->
  <meta property="og:image" content="https://app-slideshow.netlify.app/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Touch Icons for iPhone/iPad & Android Home Screen -->
  <link rel="apple-touch-icon" sizes="180x180" href="phone-icon.png" />
  <link rel="icon" type="image/png" sizes="180x180" href="phone-icon.png" />

  <!-- Tailwind CSS for modern, rapid styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Styling for full screen container */
    #slideshow-canvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    
    /* Disabled outline styling for buttons when inactive, enforcing blue outline conformity */
    .disabled-grey:disabled {
      background-color: transparent !important;
      border-color: #3b82f6 !important; /* blue-500 border */
      cursor: not-allowed;
    }

    /* Force Neon Orange color and thickness on active sidebar controls */
    #sidebar button.step-active:not(#btn-reset):not(.bg-amber-600):not(.bg-emerald-600), 
    #sidebar select.step-active, 
    #sidebar .step-active label,
    #sidebar label.step-active {
      color: #ff5f1f !important;
      opacity: 1.0 !important;
      font-weight: 600 !important;
    }

    /* Dimmed Neon Orange color for inactive sidebar controls, keeping fully bright blue borders */
    #sidebar button.step-inactive:not(#btn-reset):not(.bg-amber-600):not(.bg-emerald-600), 
    #sidebar select.step-inactive, 
    #sidebar .step-inactive label,
    #sidebar label.step-inactive {
      color: rgba(255, 95, 31, 0.4) !important;
      opacity: 1.0 !important; /* Keep element opacity 100% so border is fully bright! */
      font-weight: 600 !important;
    }

    /* Dimmed SVG icons inside inactive steps */
    #sidebar .step-inactive svg,
    #sidebar button.step-inactive svg {
      opacity: 0.4 !important;
    }

    /* Force Bright White color and thickness on the Name textarea input */
    #location-name {
      color: #ffffff !important;
      font-weight: 600 !important;
    }

    /* Target option dropdowns to stay readable with dark background and neon orange text */
    #music-select option, #aspect-ratio-select option {
      background-color: #18181b !important;
      color: #ff5f1f !important;
    }

    /* Force brightness and color on disabled select elements to bypass browser dimming */
    #sidebar select:disabled {
      font-weight: 600 !important;
      opacity: 1.0 !important;
    }
    #sidebar select:disabled.step-active {
      color: #ff5f1f !important;
      -webkit-text-fill-color: #ff5f1f !important;
    }
    #sidebar select:disabled.step-inactive {
      color: rgba(255, 95, 31, 0.4) !important;
      -webkit-text-fill-color: rgba(255, 95, 31, 0.4) !important;
    }

    /* Glow text effect for location name input value with Neon Orange text-shadow */
    #location-name.glow-text {
      text-shadow: 0 0 8px rgba(255, 95, 31, 0.95), 0 0 16px rgba(255, 95, 31, 0.65) !important;
    }

    /* Force text cursor shape on Step 1 container and label */
    #step-1-container, #name-label {
      cursor: text !important;
    }
  </style>
</head>
<body class="bg-zinc-950 text-white font-sans h-screen w-screen overflow-hidden flex flex-row select-none">

  <!-- LEFT SIDEBAR: Controls & Settings -->
  <aside id="sidebar" class="w-80 bg-zinc-900 border-r border-zinc-800 p-6 flex flex-col justify-between z-50 shrink-0">
    <!-- Top part: Title/Logo & Steps -->
    <div class="flex flex-col gap-4 overflow-y-auto pr-1">
      <div class="flex flex-col items-start gap-2.5">
        <img src="logo.png" alt="Logo" class="w-32 h-32 rounded-full border border-zinc-700 object-cover shadow-md" />
        <div>
          <h1 class="text-xl font-bold tracking-wide text-zinc-100">App_SlideShow</h1>
          <p class="text-[10px] text-zinc-400">Explore • Learn • Discover</p>
        </div>
      </div>
      
      <!-- Unified 6-Step Container -->
      <div class="flex flex-col gap-3 mt-2">
        <!-- Step 1: Name (3 rows) -->
        <div id="step-1-container" class="rounded border border-blue-500 bg-zinc-950/60 h-24 transition-all duration-300 relative">
          <label id="name-label" class="absolute top-2.5 left-2.5 text-[11px] font-bold text-zinc-400 tracking-wider select-none pointer-events-none z-10">1. Name</label>
          <textarea 
            id="location-name" 
            placeholder="" 
            class="absolute inset-0 w-full h-full bg-transparent border-0 text-xs focus:outline-none text-white resize-none text-center p-2.5 pt-5 z-0"
          ></textarea>
        </div>

        <!-- Step 2: Pictures -->
        <button id="btn-pictures" disabled class="step-inactive text-sm font-semibold py-2.5 px-4 rounded transition-all w-full text-left bg-transparent border border-blue-500 disabled-grey shadow">
          2. Pictures
        </button>
        <input type="file" id="image-loader" multiple accept="image/*" class="hidden" />

        <!-- Step 3: Music (Dropdown select + Track slots) -->
        <div id="step-3-container" class="flex flex-col justify-center p-2 rounded border border-blue-500 bg-zinc-950/60 text-left transition-all duration-300">
          <select id="music-select" disabled class="w-full bg-transparent text-sm step-inactive focus:outline-none cursor-pointer">
            <option value="none" selected>3. Music (No Music) 🎵</option>
            <option value="upload">3. Music (Upload MP3...) 📂</option>
          </select>
          <input type="file" id="audio-loader" multiple accept="audio/*" class="hidden" />
          
          <!-- Loaded Music Status & Remove Buttons -->
          <div id="music-status-container" class="hidden flex-col gap-1 mt-1.5 select-none">
            <!-- Track 1 Item -->
            <div id="track-1-item" class="hidden items-center justify-between bg-zinc-900 border border-zinc-800 px-2 py-1 rounded text-xs">
              <div class="flex items-center gap-1.5 truncate max-w-[190px]">
                <span class="text-zinc-400 font-mono text-[10px] shrink-0">1.</span>
                <span id="track-1-name" class="text-emerald-400 font-semibold truncate"></span>
              </div>
              <button type="button" id="btn-remove-track-1" title="Remove Track 1" class="text-zinc-500 hover:text-red-400 font-bold text-sm leading-none focus:outline-none ml-1 shrink-0">×</button>
            </div>
            <!-- Track 2 Item -->
            <div id="track-2-item" class="hidden items-center justify-between bg-zinc-900 border border-zinc-800 px-2 py-1 rounded text-xs">
              <div class="flex items-center gap-1.5 truncate max-w-[190px]">
                <span class="text-zinc-400 font-mono text-[10px] shrink-0">2.</span>
                <span id="track-2-name" class="text-emerald-400 font-semibold truncate"></span>
              </div>
              <button type="button" id="btn-remove-track-2" title="Remove Track 2" class="text-zinc-500 hover:text-red-400 font-bold text-sm leading-none focus:outline-none ml-1 shrink-0">×</button>
            </div>
          </div>
        </div>

        <!-- Step 4: Aspect Ratio / Mode -->
        <div id="step-4-container" class="flex flex-col justify-center p-2 rounded border border-blue-500 bg-zinc-950/60 text-left transition-all duration-300">
          <select id="aspect-ratio-select" disabled class="w-full bg-transparent text-sm step-inactive focus:outline-none cursor-pointer">
            <option value="landscape-4-3" selected>4. Landscape Mode (4:3) 📷</option>
            <option value="portrait-9-16">4. Portrait Mode (9:16) 📱</option>
          </select>
        </div>

        <!-- Step 5: Start / Pause -->
        <button id="btn-play-pause" disabled class="step-inactive text-sm font-semibold py-2.5 px-4 rounded transition-all w-full text-left bg-transparent border border-blue-500 disabled-grey shadow">
          5. Start
        </button>

        <!-- Step 6: Download Video -->
        <button id="btn-save-video" disabled class="step-inactive text-sm font-semibold py-2.5 px-4 rounded transition-all flex items-center justify-between shadow w-full bg-transparent border border-blue-500 disabled-grey">
          <span>6. Download MP4</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Bottom part: Separate container with Row of 2 buttons: Back and Reset -->
    <div class="flex flex-col gap-3 mt-auto pt-4 border-t border-zinc-800 shrink-0">
      <div class="grid grid-cols-2 gap-2">
        <button id="btn-back" class="text-white text-sm font-semibold py-2.5 px-4 rounded transition-all shadow text-center bg-transparent border border-blue-500 hover:bg-blue-500/10">
          Back
        </button>
        <button id="btn-reset" disabled class="bg-red-600 hover:bg-red-500 text-white text-sm font-semibold py-2.5 px-4 rounded transition-all shadow text-center disabled:opacity-50 disabled:cursor-not-allowed">
          Reset
        </button>
      </div>
    </div>
  </aside>

  <!-- RIGHT AREA: Viewport -->
  <main class="relative flex-grow h-screen bg-black overflow-hidden flex items-center justify-center">
    
    <!-- Empty State / Custom Welcome Screen -->
    <div id="empty-state" class="absolute inset-0 z-20 bg-zinc-950 flex items-center justify-center overflow-hidden">
      <img src="welcome.jpg" alt="Welcome to William H. Chan Slide Show Studio" class="w-full h-full object-cover opacity-90 transition-all duration-500" />
    </div>

    <!-- Active Slides Canvas -->
    <canvas id="slideshow-canvas" class="w-full h-full object-contain bg-black"></canvas>

  </main>

  <!-- ================= RENDERING PROGRESS MODAL ================= -->
  <div id="progress-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/85 backdrop-blur-sm">
    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl max-w-md w-full mx-4 text-center shadow-2xl">
      <div class="mb-4">
        <!-- Modern Loader SVG -->
        <svg class="animate-spin h-10 w-10 text-blue-500 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>
      <h3 class="text-lg font-bold text-zinc-100 mb-1" id="modal-title">Generating Cinematic Video</h3>
      <p class="text-xs text-zinc-400 mb-6">Compiling transitions, zoom effects, and logos...</p>
      
      <!-- Progress Bar -->
      <div class="w-full bg-zinc-800 h-2.5 rounded-full overflow-hidden mb-3">
        <div id="modal-progress-bar" class="bg-blue-600 h-full rounded-full transition-all duration-100" style="width: 0%;"></div>
      </div>
      <div class="flex justify-between items-center text-xs mb-6">
        <span class="text-zinc-500">Rendering Progress</span>
        <span id="modal-percentage" class="font-semibold text-blue-400">0%</span>
      </div>
      
      <div class="p-3 bg-blue-950/20 border border-blue-900/30 rounded text-left flex gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-[11px] text-zinc-400 leading-normal">
          <strong>Important:</strong> Keep this browser tab open and active during export to ensure smooth and uninterrupted video generation.
        </p>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    const imageLoader = document.getElementById('image-loader');
    const locationInput = document.getElementById('location-name');
    const audioLoader = document.getElementById('audio-loader');
    const musicSelect = document.getElementById('music-select');
    const musicStatusContainer = document.getElementById('music-status-container');
    const track1Item = document.getElementById('track-1-item');
    const track2Item = document.getElementById('track-2-item');
    const track1Name = document.getElementById('track-1-name');
    const track2Name = document.getElementById('track-2-name');
    const btnRemoveTrack1 = document.getElementById('btn-remove-track-1');
    const btnRemoveTrack2 = document.getElementById('btn-remove-track-2');
    const canvas = document.getElementById('slideshow-canvas');
    const ctx = canvas.getContext('2d');
    const emptyState = document.getElementById('empty-state');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const btnReset = document.getElementById('btn-reset');
    const btnSaveVideo = document.getElementById('btn-save-video');
    const aspectRatioSelect = document.getElementById('aspect-ratio-select');
    const btnPictures = document.getElementById('btn-pictures');
    const btnBack = document.getElementById('btn-back');

    // Modal elements
    const progressModal = document.getElementById('progress-modal');
    const modalProgressBar = document.getElementById('modal-progress-bar');
    const modalPercentage = document.getElementById('modal-percentage');

    // Canvas Settings & Aspect Ratio Configuration
    const aspectRatios = {
      'landscape-4-3': { w: 1440, h: 1080 },
      'portrait-9-16': { w: 1080, h: 1920 }
    };
    let V_WIDTH = 1440;
    let V_HEIGHT = 1080;

    canvas.width = V_WIDTH;
    canvas.height = V_HEIGHT;

    function handleAspectRatioChange() {
      const selected = aspectRatioSelect.value;
      if (aspectRatios[selected]) {
        V_WIDTH = aspectRatios[selected].w;
        V_HEIGHT = aspectRatios[selected].h;
        canvas.width = V_WIDTH;
        canvas.height = V_HEIGHT;
        
        // Redraw current frame if images are loaded to provide immediate preview
        if (loadedImages.length > 0) {
          drawFrame(slideshowTime);
        }
      }
    }
    
    aspectRatioSelect.addEventListener('change', handleAspectRatioChange);

    // State Variables
    let imagesList = [];     // Array of Object URLs
    let loadedImages = [];   // Array of Image elements
    let endScreenImage = new Image();
    let endScreenLoaded = false;
    const originalEmptyStateHTML = emptyState.innerHTML;

    // Preload end screen artwork
    endScreenImage.onload = () => { endScreenLoaded = true; };
    endScreenImage.onerror = () => { endScreenLoaded = false; };
    endScreenImage.src = 'endscreen.jpg';

    // Background Audio Variables (Supports up to 2 tracks with continuous looping)
    let musicTracks = []; // Array of { file: File, url: string, name: string }
    let isAddingSecondTrack = false;
    let currentTrackIndex = 0; // 0 for Track 1, 1 for Track 2

    const bgAudio1 = new Audio();
    const bgAudio2 = new Audio();
    bgAudio1.crossOrigin = "anonymous";
    bgAudio2.crossOrigin = "anonymous";

    let bgAudioCtx = null;
    let bgAudioSource1 = null;
    let bgAudioSource2 = null;
    let bgAudioDest = null;
    let masterGainNode = null;

    // Continuous looping logic: Track 1 -> Track 2 -> Track 1 -> Track 2...
    bgAudio1.onended = () => {
      if (!isPlaying) return;
      if (musicTracks.length === 1) {
        bgAudio1.currentTime = 0;
        bgAudio1.play().catch(e => console.warn("Audio 1 loop error:", e));
      } else if (musicTracks.length === 2) {
        currentTrackIndex = 1;
        bgAudio2.currentTime = 0;
        bgAudio2.play().catch(e => console.warn("Audio 2 switch error:", e));
      }
    };

    bgAudio2.onended = () => {
      if (!isPlaying) return;
      if (musicTracks.length === 2) {
        currentTrackIndex = 0;
        bgAudio1.currentTime = 0;
        bgAudio1.play().catch(e => console.warn("Audio 1 switch error:", e));
      }
    };

    let slideshowTime = 0;   // Current elapsed time in milliseconds
    let lastTimestamp = 0;   // Timestamp of last frame
    let isPlaying = false;
    let isRecording = false;
    let animationFrameId = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedVideoBlob = null;
    let recordedVideoUrl = null;
    let isSavingRequested = false;

    // Timing constants
    const FRAME_DURATION = 4000;   // 4 seconds per image slide
    const TRANSITION_DURATION = 800; // 0.8 seconds cross-dissolve overlap
    const END_SLIDE_DURATION = 4000; // 4 seconds showing the logo

    // Initialize button states as disabled
    updateStepValidation();

    // Event Handlers
    imageLoader.addEventListener('change', handleImageSelection);
    audioLoader.addEventListener('change', handleCustomAudioUpload);
    musicSelect.addEventListener('change', handleMusicSelection);
    btnRemoveTrack1.addEventListener('click', () => removeSingleTrack(0));
    btnRemoveTrack2.addEventListener('click', () => removeSingleTrack(1));

    // Wire up Pictures button
    btnPictures.addEventListener('click', () => {
      imageLoader.click();
    });

    // Wire up text input for location name (3 rows max) and manage label visibility
    const nameLabel = document.getElementById('name-label');
    
    function updateNameLabelVisibility() {
      const isFocused = document.activeElement === locationInput;
      const hasValue = locationInput.value.trim().length > 0;
      
      if (isFocused || hasValue) {
        nameLabel.classList.add('hidden');
      } else {
        nameLabel.classList.remove('hidden');
      }

      if (hasValue) {
        locationInput.classList.add('glow-text');
      } else {
        locationInput.classList.remove('glow-text');
      }
    }

    locationInput.addEventListener('focus', updateNameLabelVisibility);
    locationInput.addEventListener('blur', () => {
      updateNameLabelVisibility();
      if (locationInput.value.trim().length > 0 && loadedImages.length === 0) {
        btnPictures.focus();
      }
    });
    locationInput.addEventListener('input', () => {
      const lines = locationInput.value.split('\n');
      if (lines.length > 3) {
        locationInput.value = lines.slice(0, 3).join('\n');
      }
      updateNameLabelVisibility();
      updateStepValidation();
    });
    locationInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const lines = locationInput.value.split('\n');
        // When user is on the 3rd line (2 newlines already exist), finish input and focus Step 2!
        if (lines.length >= 3) {
          e.preventDefault();
          locationInput.blur();
        }
      }
    });
    
    // Set initial label state
    updateNameLabelVisibility();

    // Wire up Back button
    btnBack.addEventListener('click', () => {
      const nameValue = locationInput.value.trim();
      const hasImages = loadedImages.length > 0;
      
      if (hasImages && musicTracks.length > 0) {
        isAddingSecondTrack = false;
        audioLoader.click();
      } else if (hasImages) {
        imageLoader.click();
      } else if (nameValue.length > 0) {
        locationInput.focus();
        const len = locationInput.value.length;
        locationInput.setSelectionRange(len, len);
      } else {
        window.history.back();
      }
    });

    // Initialize Web Audio context on user gesture to bypass browser block
    function initAudioContext() {
      if (!bgAudioCtx) {
        try {
          bgAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
          bgAudioDest = bgAudioCtx.createMediaStreamDestination();
          masterGainNode = bgAudioCtx.createGain();
          masterGainNode.gain.value = 1.0;
          
          masterGainNode.connect(bgAudioCtx.destination);
          masterGainNode.connect(bgAudioDest);

          bgAudioSource1 = bgAudioCtx.createMediaElementSource(bgAudio1);
          bgAudioSource1.connect(masterGainNode);

          bgAudioSource2 = bgAudioCtx.createMediaElementSource(bgAudio2);
          bgAudioSource2.connect(masterGainNode);
        } catch (e) {
          console.error("Web Audio Context initialization failed:", e);
        }
      }
      if (bgAudioCtx && bgAudioCtx.state === 'suspended') {
        bgAudioCtx.resume();
      }
    }

    // Music Box selection handler
    function handleMusicSelection() {
      const selected = musicSelect.value;
      if (selected === 'none') {
        removeAllMusic();
      } else if (selected === 'upload' || selected === 'replace') {
        isAddingSecondTrack = false;
        audioLoader.value = "";
        audioLoader.click();
      } else if (selected === 'add-more') {
        isAddingSecondTrack = true;
        audioLoader.value = "";
        audioLoader.click();
      }
    }

    // Custom local audio files upload handler
    function handleCustomAudioUpload(event) {
      const files = Array.from(event.target.files);
      if (files.length === 0) {
        updateMusicUI();
        return;
      }

      if (isAddingSecondTrack) {
        // Append 1 track to existing track 1
        if (files[0] && musicTracks.length < 2) {
          const url = URL.createObjectURL(files[0]);
          musicTracks.push({ file: files[0], url: url, name: files[0].name });
        }
      } else {
        // Replace current tracks with up to 2 selected files
        musicTracks.forEach(t => URL.revokeObjectURL(t.url));
        musicTracks = [];
        const filesToAdd = files.slice(0, 2);
        filesToAdd.forEach(file => {
          const url = URL.createObjectURL(file);
          musicTracks.push({ file: file, url: url, name: file.name });
        });
      }

      isAddingSecondTrack = false;
      applyMusicTracks();
    }

    function removeSingleTrack(index) {
      if (index >= 0 && index < musicTracks.length) {
        URL.revokeObjectURL(musicTracks[index].url);
        musicTracks.splice(index, 1);
        applyMusicTracks();
      }
    }

    function removeAllMusic() {
      bgAudio1.pause();
      bgAudio2.pause();
      musicTracks.forEach(t => URL.revokeObjectURL(t.url));
      musicTracks = [];
      applyMusicTracks();
    }

    function applyMusicTracks() {
      bgAudio1.pause();
      bgAudio2.pause();
      bgAudio1.currentTime = 0;
      bgAudio2.currentTime = 0;
      currentTrackIndex = 0;

      if (musicTracks.length === 0) {
        bgAudio1.src = "";
        bgAudio2.src = "";
        bgAudio1.load();
        bgAudio2.load();
      } else if (musicTracks.length === 1) {
        bgAudio1.removeAttribute('crossorigin');
        bgAudio1.src = musicTracks[0].url;
        bgAudio1.load();
        bgAudio2.src = "";
        bgAudio2.load();
      } else if (musicTracks.length === 2) {
        bgAudio1.removeAttribute('crossorigin');
        bgAudio2.removeAttribute('crossorigin');
        bgAudio1.src = musicTracks[0].url;
        bgAudio1.load();
        bgAudio2.src = musicTracks[1].url;
        bgAudio2.load();
      }

      updateMusicUI();
      updateStepValidation();
    }

    function updateMusicUI() {
      if (musicTracks.length === 0) {
        musicStatusContainer.classList.add('hidden');
        musicStatusContainer.classList.remove('flex');
        track1Item.classList.add('hidden');
        track1Item.classList.remove('flex');
        track2Item.classList.add('hidden');
        track2Item.classList.remove('flex');
        
        musicSelect.innerHTML = `
          <option value="none" selected>3. Music (No Music) 🎵</option>
          <option value="upload">3. Music (Upload MP3...) 📂</option>
        `;
        musicSelect.value = 'none';
      } else if (musicTracks.length === 1) {
        musicStatusContainer.classList.remove('hidden');
        musicStatusContainer.classList.add('flex');
        
        track1Item.classList.remove('hidden');
        track1Item.classList.add('flex');
        track1Name.innerText = musicTracks[0].name;
        track1Name.title = musicTracks[0].name;

        track2Item.classList.add('hidden');
        track2Item.classList.remove('flex');

        musicSelect.innerHTML = `
          <option value="loaded-1" selected>3. Music (1 Track: Loop) 🎵</option>
          <option value="add-more">➕ Add 2nd Music Track... 📂</option>
          <option value="replace">📂 Replace Music Files...</option>
          <option value="none">❌ Remove All Music</option>
        `;
        musicSelect.value = 'loaded-1';
      } else if (musicTracks.length >= 2) {
        musicStatusContainer.classList.remove('hidden');
        musicStatusContainer.classList.add('flex');
        
        track1Item.classList.remove('hidden');
        track1Item.classList.add('flex');
        track1Name.innerText = musicTracks[0].name;
        track1Name.title = musicTracks[0].name;

        track2Item.classList.remove('hidden');
        track2Item.classList.add('flex');
        track2Name.innerText = musicTracks[1].name;
        track2Name.title = musicTracks[1].name;

        musicSelect.innerHTML = `
          <option value="loaded-2" selected>3. Music (2 Tracks: Loop 1⇄2) 🎵</option>
          <option value="replace">📂 Replace Music Files...</option>
          <option value="none">❌ Remove All Music</option>
        `;
        musicSelect.value = 'loaded-2';
      }
    }

    // File selection event handler
    function handleImageSelection(event) {
      const files = Array.from(event.target.files);
      if (files.length === 0) return;

      // Reset existing state
      resetSlideshow();
      imagesList = [];
      loadedImages = [];

      // Sort files alphabetically to respect local sorting sequence
      files.sort((a, b) => a.name.localeCompare(b.name));

      // Map to object URLs
      const urls = files.map(file => URL.createObjectURL(file));
      imagesList = urls;

      // Show temporary loading UI
      emptyState.innerHTML = `
        <div class="text-center flex flex-col items-center">
          <svg class="animate-spin h-8 w-8 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <h2 class="text-lg font-semibold mb-1">Preloading Pictures</h2>
          <p class="text-sm text-zinc-500">Optimizing images for cinematic rendering...</p>
        </div>
      `;
      emptyState.classList.remove('hidden');

      // Preload images into memory (and check if end screen artwork is preloaded too)
      let loadedCount = 0;
      let totalToLoad = urls.length;

      const checkAllLoaded = () => {
        loadedCount++;
        if (loadedCount === totalToLoad) {
          onImagesPreloaded();
        }
      };

      if (!endScreenImage.complete) {
        totalToLoad++;
        endScreenImage.onload = () => {
          endScreenLoaded = true;
          checkAllLoaded();
        };
        endScreenImage.onerror = () => {
          endScreenLoaded = false;
          checkAllLoaded();
        };
      }

      urls.forEach((url, idx) => {
        const img = new Image();
        img.onload = checkAllLoaded;
        img.onerror = checkAllLoaded;
        img.src = url;
        loadedImages[idx] = img;
      });
    }

    function onImagesPreloaded() {
      emptyState.classList.add('hidden');
      updateStepValidation();
      
      // Draw initial slide frame
      drawFrame(0);
      btnPlayPause.focus();
    }

    // Play/Pause control
    btnPlayPause.addEventListener('click', () => {
      if (isPlaying) {
        pauseSlideshow();
      } else {
        startSlideshow();
      }
    });

    // Reset control
    btnReset.addEventListener('click', () => resetSlideshow(true));

    // Save as Video control
    btnSaveVideo.addEventListener('click', () => {
      if (loadedImages.length === 0) return;

      if (recordedVideoUrl) {
        // Instant download of the pre-recorded video blob
        const ext = 'mp4';
        
        const a = document.createElement('a');
        a.href = recordedVideoUrl;
        a.download = `travel_slideshow_${Date.now()}.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } else {
        // Trigger recording playback with visual progress modal
        isSavingRequested = true;
        progressModal.classList.remove('hidden');
        progressModal.classList.add('flex');
        
        if (isPlaying) {
          // If already playing, just continue recording (which is running in bg anyway)
        } else {
          // Play from beginning
          slideshowTime = 0;
          lastTimestamp = 0;
          bgAudio1.currentTime = 0;
          bgAudio2.currentTime = 0;
          currentTrackIndex = 0;
          startSlideshow();
        }
      }
    });

    function startSlideshow() {
      if (loadedImages.length === 0) return;
      
      initAudioContext();
      
      // Resume context if suspended (browser security autoplay policies)
      if (bgAudioCtx && bgAudioCtx.state === 'suspended') {
        bgAudioCtx.resume();
      }

      // If starting from the very beginning (time = 0), initialize background MediaRecorder
      if (slideshowTime === 0) {
        recordedChunks = [];
        recordedVideoBlob = null;
        if (recordedVideoUrl) {
          URL.revokeObjectURL(recordedVideoUrl);
          recordedVideoUrl = null;
        }
        
        // Restore Save button back to blue state
        btnSaveVideo.innerHTML = `
          <span>6. Download MP4</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
        `;
        btnSaveVideo.className = "text-white text-sm font-semibold py-2.5 px-4 rounded transition-all flex items-center justify-between shadow w-full bg-transparent border border-blue-500 disabled-grey";

        // Determine the best video mimeType supported by the user's browser (prefer MP4)
        let mimeType = 'video/mp4;codecs=h264';
        if (MediaRecorder.isTypeSupported('video/mp4;codecs=h264')) {
          mimeType = 'video/mp4;codecs=h264';
        } else if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')) {
          mimeType = 'video/mp4;codecs=avc1';
        } else if (MediaRecorder.isTypeSupported('video/mp4')) {
          mimeType = 'video/mp4';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
          mimeType = 'video/webm;codecs=vp9';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
          mimeType = 'video/webm;codecs=vp8';
        } else if (MediaRecorder.isTypeSupported('video/webm')) {
          mimeType = 'video/webm';
        }

        const canvasStream = canvas.captureStream(30); // Capture canvas at 30 FPS
        const videoTrack = canvasStream.getVideoTracks()[0];
        let combinedStream = canvasStream;

        // Mix background audio into the recording stream if active
        if (musicTracks.length > 0 && bgAudioDest) {
          const audioTrack = bgAudioDest.stream.getAudioTracks()[0];
          if (audioTrack) {
            combinedStream = new MediaStream([videoTrack, audioTrack]);
          }
        }
        
        try {
          mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mimeType });
        } catch (e) {
          console.warn("Fallback to default MediaRecorder configuration:", e);
          mediaRecorder = new MediaRecorder(combinedStream);
        }

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          const recordedMime = mediaRecorder.mimeType || mimeType;
          const ext = 'mp4';
          
          recordedVideoBlob = new Blob(recordedChunks, { type: recordedMime });
          recordedVideoUrl = URL.createObjectURL(recordedVideoBlob);
          
          // Enable direct instant download on Save as Video button
          btnSaveVideo.innerHTML = `
            <span>6. Download MP4</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
          `;
          btnSaveVideo.className = "bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold py-2.5 px-4 rounded transition-all flex items-center justify-between shadow w-full";

          if (isSavingRequested) {
            // Trigger instant download
            const a = document.createElement('a');
            a.href = recordedVideoUrl;
            a.download = `travel_slideshow_${Date.now()}.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // Hide progress modal
            progressModal.classList.add('hidden');
            progressModal.classList.remove('flex');
            
            isSavingRequested = false;
            resetSlideshow();
          }
        };

        mediaRecorder.start();
      } else {
        // If resuming from a paused state
        if (mediaRecorder && mediaRecorder.state === 'paused') {
          mediaRecorder.resume();
        }
      }
      
      isPlaying = true;
      lastTimestamp = 0;
      btnPlayPause.innerText = '5. Pause';
      btnPlayPause.className = "text-white text-sm font-semibold py-2.5 px-4 rounded transition-all w-full text-left bg-amber-600 hover:bg-amber-500 shadow";

      // Disable inputs during active slideshow play/export
      aspectRatioSelect.disabled = true;
      musicSelect.disabled = true;
      locationInput.disabled = true;
      btnPictures.disabled = true;
      btnBack.disabled = true;
      btnBack.classList.add('opacity-50', 'pointer-events-none');
      btnReset.disabled = true;

      // Mute other steps and highlight active Step 5 (Pause)
      const step1 = document.getElementById('step-1-container');
      const step2 = btnPictures;
      const step3 = document.getElementById('step-3-container');
      const step4 = document.getElementById('step-4-container');
      const step6 = btnSaveVideo;
      [step1, step2, step3, step4, step6].forEach(step => {
        step.classList.remove('opacity-100', 'opacity-70');
        step.classList.add('opacity-40');
      });
      btnPlayPause.classList.remove('opacity-40');
      btnPlayPause.classList.add('opacity-100');

      if (musicTracks.length > 0) {
        if (currentTrackIndex === 0) {
          bgAudio1.play().catch(e => console.warn("Audio 1 play blocked by browser:", e));
        } else {
          bgAudio2.play().catch(e => console.warn("Audio 2 play blocked by browser:", e));
        }
      }

      if (!animationFrameId) {
        animationFrameId = requestAnimationFrame(animLoop);
      }
    }

    function pauseSlideshow() {
      isPlaying = false;
      btnPlayPause.innerText = '5. Start';
      btnPlayPause.className = "text-white text-sm font-semibold py-2.5 px-4 rounded transition-all w-full text-left bg-transparent border border-blue-500 hover:bg-blue-500/10 disabled-grey shadow";
      
      // Re-enable inputs
      btnBack.disabled = false;
      btnBack.classList.remove('opacity-50', 'pointer-events-none');
      
      updateStepValidation();

      bgAudio1.pause();
      bgAudio2.pause();

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.pause();
      }

      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    function resetSlideshow(clearName = false) {
      pauseSlideshow();
      slideshowTime = 0;
      lastTimestamp = 0;

      // Clear text inputs and selectors
      if (clearName === true) {
        locationInput.value = "";
      }
      locationInput.disabled = false;
      imageLoader.value = "";
      audioLoader.value = "";

      // Revoke and clear loaded images
      imagesList.forEach(url => URL.revokeObjectURL(url));
      imagesList = [];
      loadedImages = [];

      // Reset audio states
      bgAudio1.pause();
      bgAudio2.pause();
      bgAudio1.currentTime = 0;
      bgAudio2.currentTime = 0;
      currentTrackIndex = 0;
      if (masterGainNode) masterGainNode.gain.value = 1.0;
      bgAudio1.volume = 1.0;
      bgAudio2.volume = 1.0;

      // Revoke and clear recorded video states
      recordedVideoBlob = null;
      if (recordedVideoUrl) {
        URL.revokeObjectURL(recordedVideoUrl);
        recordedVideoUrl = null;
      }
      isSavingRequested = false;

      // Hide progress modal
      progressModal.classList.add('hidden');
      progressModal.classList.remove('flex');

      // Restore Save button back to blue state
      btnSaveVideo.innerHTML = `
        <span>6. Download MP4</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
      `;
      btnSaveVideo.className = "text-white text-sm font-semibold py-2.5 px-4 rounded transition-all flex items-center justify-between shadow w-full bg-transparent border border-blue-500 disabled-grey";

      // Reset play/pause button state back to original "Start"
      btnPlayPause.innerText = '5. Start';
      btnPlayPause.className = "text-white text-sm font-semibold py-2.5 px-4 rounded transition-all w-full text-left bg-transparent border border-blue-500 disabled-grey shadow";

      // Re-enable back button
      btnBack.disabled = false;
      btnBack.classList.remove('opacity-50', 'pointer-events-none');

      // Restore welcome screen with original HTML image content
      emptyState.innerHTML = originalEmptyStateHTML;
      emptyState.classList.remove('hidden');

      // Clear canvas
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      updateNameLabelVisibility();
      updateStepValidation();
    }

    function updateStepValidation() {
      const nameValue = locationInput.value.trim();
      const hasName = nameValue.length > 0;
      const hasImages = loadedImages.length > 0;

      // Select container and button elements
      const step1 = document.getElementById('step-1-container');
      const step2 = btnPictures;
      const step3 = document.getElementById('step-3-container');
      const step4 = document.getElementById('step-4-container');
      const step5 = btnPlayPause;
      const step6 = btnSaveVideo;

      // Ensure all container outlines are ALWAYS 100% bright blue
      const allContainers = [step1, step2, step3, step4, step5, step6];
      allContainers.forEach(container => {
        container.classList.remove('border-blue-500/40', 'border-zinc-700');
        container.classList.add('border-blue-500');
      });

      // Reset active/inactive typography classes for all non-Name steps
      const contentElements = [step2, musicSelect, aspectRatioSelect, step5, step6];
      contentElements.forEach(el => {
        el.classList.remove('step-active');
        el.classList.add('step-inactive');
      });

      // Enable/Disable native attributes based on sequence
      if (hasName) {
        step2.removeAttribute('disabled');
      } else {
        step2.setAttribute('disabled', 'true');
      }

      if (hasImages) {
        musicSelect.removeAttribute('disabled');
        aspectRatioSelect.removeAttribute('disabled');
      } else {
        musicSelect.setAttribute('disabled', 'true');
        aspectRatioSelect.setAttribute('disabled', 'true');
      }

      if (hasName && hasImages) {
        step5.removeAttribute('disabled');
      } else {
        step5.setAttribute('disabled', 'true');
      }

      if (hasName && hasImages) {
        step6.removeAttribute('disabled');
      } else {
        step6.setAttribute('disabled', 'true');
      }

      // Manage typography active states
      if (!hasName) {
        // Step 1 Name is the active step
      } else if (!hasImages) {
        // Step 2 Pictures is active
        step2.classList.remove('step-inactive');
        step2.classList.add('step-active');
      } else {
        // Step 5 Start is active
        step5.classList.remove('step-inactive');
        step5.classList.add('step-active');
        
        // Music & Mode are active
        musicSelect.classList.remove('step-inactive');
        musicSelect.classList.add('step-active');
        aspectRatioSelect.classList.remove('step-inactive');
        aspectRatioSelect.classList.add('step-active');
      }

      // Reset Button (Red background, active if we have name or pictures)
      if (hasName || hasImages) {
        btnReset.removeAttribute('disabled');
      } else {
        btnReset.setAttribute('disabled', 'true');
      }
    }

    // Main animation loop
    function animLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      if (isPlaying) {
        slideshowTime += dt;
      }

      drawFrame(slideshowTime);

      const N = loadedImages.length;
      const totalDuration = N * FRAME_DURATION + END_SLIDE_DURATION;

      // Handle music fade-out in the last 2 seconds of the end screen
      if (isPlaying && musicTracks.length > 0) {
        const timeLeft = totalDuration - slideshowTime;
        if (timeLeft <= 2000) {
          const vol = Math.max(0, timeLeft / 2000);
          if (masterGainNode) masterGainNode.gain.value = vol;
          bgAudio1.volume = vol;
          bgAudio2.volume = vol;
        } else {
          if (masterGainNode) masterGainNode.gain.value = 1.0;
          bgAudio1.volume = 1.0;
          bgAudio2.volume = 1.0;
        }
      }

      // Manage progress bar during video export
      if (isSavingRequested) {
        const progressPercent = Math.min(100, Math.floor((slideshowTime / totalDuration) * 100));
        modalProgressBar.style.width = `${progressPercent}%`;
        modalPercentage.innerText = `${progressPercent}%`;
      }

      // Check if slideshow is complete
      if (slideshowTime >= totalDuration) {
        pauseSlideshow();
        if (mediaRecorder && (mediaRecorder.state === 'recording' || mediaRecorder.state === 'paused')) {
          mediaRecorder.stop();
        }
      } else {
        animationFrameId = requestAnimationFrame(animLoop);
      }
    }

    // Calculate Ken Burns scale factor (1.0 to 1.15)
    function getSlideScale(i, time) {
      const t_start = i > 0 ? (i * FRAME_DURATION - TRANSITION_DURATION) : 0;
      const elapsed = time - t_start;
      if (elapsed < 0) return 0.95;
      
      const duration = i > 0 ? (FRAME_DURATION + TRANSITION_DURATION) : FRAME_DURATION;
      const progress = Math.min(1.0, elapsed / duration);
      return 0.95 + 0.08 * progress;
    }

    // Helper to draw an image centered and scaled with CSS object-cover behavior
    function drawImageSlide(ctx, img, scale, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;

      const canvasRatio = V_WIDTH / V_HEIGHT;
      const imgRatio = img.width / img.height;
      let drawWidth, drawHeight;

      if (imgRatio > canvasRatio) {
        drawWidth = V_WIDTH;
        drawHeight = V_WIDTH / imgRatio;
      } else {
        drawHeight = V_HEIGHT;
        drawWidth = V_HEIGHT * imgRatio;
      }

      // Center scale and draw
      ctx.translate(V_WIDTH / 2, V_HEIGHT / 2);
      ctx.scale(scale, scale);
      ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);

      ctx.restore();
    }

    // Render a single frame to the canvas
    function drawFrame(time) {
      // Clear with dark solid background
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      const N = loadedImages.length;
      if (N === 0) return;

      const totalImageTime = N * FRAME_DURATION;

      if (time >= totalImageTime) {
        // --- DRAW END SLIDE ---
        const endElapsed = time - totalImageTime;
        const alpha = Math.min(1.0, endElapsed / TRANSITION_DURATION);

        // Solid dark background for logo screen
        ctx.fillStyle = '#09090b';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        // Cross-fade: Draw last image fading out
        if (endElapsed < TRANSITION_DURATION) {
          const lastImg = loadedImages[N - 1];
          const lastScale = getSlideScale(N - 1, time);
          if (lastImg) {
            drawImageSlide(ctx, lastImg, lastScale, 1.0 - alpha);
          }
        }

        // Draw end screen contents
        ctx.save();
        ctx.globalAlpha = alpha;

        const hasEndScreen = endScreenImage.complete && endScreenImage.naturalWidth > 0;

        if (hasEndScreen) {
          // Subtle pulsing zoom for end screen artwork
          const pulseScale = 1.0 + 0.02 * Math.sin(endElapsed * 0.002);
          const imgW = endScreenImage.naturalWidth;
          const imgH = endScreenImage.naturalHeight;
          const imgAspect = imgW / imgH;

          // Fit comfortably within canvas bounds
          const maxW = V_WIDTH * 0.86;
          const maxH = V_HEIGHT * 0.86;

          let targetW, targetH;
          if (maxW / maxH > imgAspect) {
            targetH = maxH;
            targetW = targetH * imgAspect;
          } else {
            targetW = maxW;
            targetH = targetW / imgAspect;
          }

          const drawW = targetW * pulseScale;
          const drawH = targetH * pulseScale;
          const drawX = (V_WIDTH - drawW) / 2;
          const drawY = (V_HEIGHT - drawH) / 2;
          const cornerRadius = Math.floor(16 * (V_WIDTH / 1440));

          // Soft drop shadow
          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          ctx.shadowBlur = Math.floor(30 * (V_WIDTH / 1440));
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = Math.floor(8 * (V_HEIGHT / 1080));

          // Rounded card clip
          ctx.beginPath();
          ctx.roundRect(drawX, drawY, drawW, drawH, cornerRadius);
          ctx.clip();

          // Draw end screen image
          ctx.drawImage(endScreenImage, drawX, drawY, drawW, drawH);
          ctx.restore();

          // Elegant subtle border outline
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.lineWidth = Math.max(1, Math.floor(2 * (V_WIDTH / 1440)));
          ctx.beginPath();
          ctx.roundRect(drawX, drawY, drawW, drawH, cornerRadius);
          ctx.stroke();
        } else {
          // Draw a beautiful fallback styled icon (pulsing circular badge with W)
          const pulseScale = 1.0 + 0.03 * Math.sin(endElapsed * 0.002);
          const baseRadius = Math.floor(V_WIDTH * 0.083); // 120px for 1440 width
          const radius = baseRadius * pulseScale;
          const logoY = V_HEIGHT / 2 - Math.floor(V_HEIGHT * 0.074); // -80px for 1080 height

          ctx.beginPath();
          ctx.arc(V_WIDTH / 2, logoY, radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(30, 58, 138, 0.3)'; // blue-900/30
          ctx.fill();
          
          ctx.strokeStyle = 'rgba(59, 130, 246, 0.5)'; // blue-500/50
          ctx.lineWidth = 4;
          ctx.stroke();
          
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#60a5fa'; // blue-400
          ctx.font = `bold ${Math.floor(80 * (V_WIDTH / 1440) * pulseScale)}px sans-serif`;
          ctx.fillText('W', V_WIDTH / 2, logoY);

          // Draw ending texts for fallback
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 2;

          const endTitleFontSize = Math.floor(V_WIDTH * 0.025); // 36px for 1440 width
          const endSubFontSize = Math.floor(V_WIDTH * 0.014); // 20px for 1440 width

          ctx.fillStyle = '#f4f4f5'; // zinc-100
          ctx.font = `bold ${endTitleFontSize}px sans-serif`;
          ctx.fillText('William H. Chan Studio', V_WIDTH / 2, V_HEIGHT / 2 + Math.floor(V_HEIGHT * 0.092));

          ctx.fillStyle = '#a1a1aa'; // zinc-400
          ctx.font = `${endSubFontSize}px sans-serif`;
          ctx.fillText('Explore. Learn. Discover.', V_WIDTH / 2, V_HEIGHT / 2 + Math.floor(V_HEIGHT * 0.148));
        }

        ctx.restore();
      } else {
        // --- DRAW IMAGE SLIDES ---
        const idx = Math.floor(time / FRAME_DURATION);
        const t_slide = time % FRAME_DURATION;

        // Current base image
        const imgCurr = loadedImages[idx];
        const scaleCurr = getSlideScale(idx, time);

        if (imgCurr) {
          drawImageSlide(ctx, imgCurr, scaleCurr, 1.0);
        }

        // Transition: Cross-dissolve into next slide
        if (t_slide >= (FRAME_DURATION - TRANSITION_DURATION)) {
          const nextIdx = idx + 1;
          const progress = (t_slide - (FRAME_DURATION - TRANSITION_DURATION)) / TRANSITION_DURATION;

          if (nextIdx < N) {
            const imgNext = loadedImages[nextIdx];
            const scaleNext = getSlideScale(nextIdx, time);
            if (imgNext) {
              drawImageSlide(ctx, imgNext, scaleNext, progress);
            }
          } else {
            // Fade-in dark screen of end slide
            ctx.save();
            ctx.fillStyle = '#09090b';
            ctx.globalAlpha = progress;
            ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
            ctx.restore();
          }
        }

        // Draw Place / City Name Overlay
        const locationName = locationInput.value.trim();
        if (locationName && time < (2 * FRAME_DURATION)) {
          let textAlpha = 1.0;
          if (time < TRANSITION_DURATION) {
            textAlpha = time / TRANSITION_DURATION;
          } else if (time > (2 * FRAME_DURATION - TRANSITION_DURATION)) {
            textAlpha = Math.max(0, 1 - (time - (2 * FRAME_DURATION - TRANSITION_DURATION)) / TRANSITION_DURATION);
          }

          ctx.save();
          ctx.globalAlpha = textAlpha;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Text shadow
          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 4;

          // Header Text (Supports multi-line text split by newlines up to 3 lines)
          const lines = locationName.split('\n').map(line => line.trim()).filter(line => line.length > 0);
          
          let titleFontSize = Math.floor(V_WIDTH * 0.05); // Default 72px for 1440 width
          if (lines.length >= 3) {
            titleFontSize = Math.floor(V_WIDTH * 0.042); // ~60px for 1440 width, elegant 3-line layout
          }

          ctx.fillStyle = '#ffffff';
          ctx.font = `bold ${titleFontSize}px sans-serif`;
          if ('letterSpacing' in ctx) {
            ctx.letterSpacing = `${Math.floor(titleFontSize * 0.11)}px`; // Letter-spacing
          }
          
          const lineHeight = titleFontSize * 1.28;
          const startY = V_HEIGHT / 2 - ((lines.length - 1) * lineHeight) / 2;
          
          lines.forEach((lineText, lineIdx) => {
            ctx.fillText(lineText.toUpperCase(), V_WIDTH / 2, startY + lineIdx * lineHeight);
          });

          // White underline divider (placed below the last line)
          const dividerWidth = Math.floor(V_WIDTH * 0.055); // 80px for 1440 width
          const dividerOffset = Math.floor(titleFontSize * 0.7) + ((lines.length - 1) * lineHeight) / 2;
          const dividerThickness = Math.max(2, Math.floor(titleFontSize * 0.05)); // 4px for 72px font

          ctx.shadowColor = 'transparent';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.beginPath();
          ctx.roundRect(V_WIDTH / 2 - dividerWidth / 2, V_HEIGHT / 2 + dividerOffset, dividerWidth, dividerThickness, 2);
          ctx.fill();

          ctx.restore();
        }
      }
    }

  </script>
</body>
